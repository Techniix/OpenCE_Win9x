# The Windows 9x build without drawing but with sound (port/win98/README.md):
# the main menu's music should play through waveOut for a minute. Copy it
# beside halo.exe as config.toml (attrib -r config.toml if from a CD).

[debug]
null_renderer = true
exit_after = 60.0

[audio]
enabled = true
# what the game's mixer costs the processor: the Xbox's reverb, and
# resampling each sound with a band-limited (sinc) filter; true and "sinc"
# sound as the Xbox did, false and "linear" leave a slow machine more time
reverb = false
resampler = "linear"

[update]
auto = false

[crash_reports]
upload = "no"

[discord]
application_id = ""
